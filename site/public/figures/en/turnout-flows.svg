<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Diagram of the flows between the two rounds"><style>
    .surface{fill:#fbfbfc}.ink{fill:#16181d}.muted{fill:#5a616e}
    .rule{stroke:#dfe2e8}.grid{stroke:#e8eaee}.frame{fill:none;stroke:#c9cdd5}
    .accent{fill:#432a70}.accent-line{stroke:#432a70}
    @media(prefers-color-scheme:dark){.surface{fill:#14161a}.ink{fill:#e9eaee}
    .muted{fill:#9aa2b1}.rule{stroke:#3a3f49}.grid{stroke:#292d35}.frame{stroke:#555c69}
    .accent{fill:#b09ce8}.accent-line{stroke:#b09ce8}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    </style><defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a78d6"/></marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b56824"/></marker>
        <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7b818c"/></marker>
        </defs><rect class="surface" width="760" height="350"/><text class="ink" x="20" y="28" font-size="16" font-weight="600">Vote flows between the two rounds</text><text class="muted" x="20" y="48" font-size="11">Each first-round pool is split between qualified candidates and non-expressed ballots.</text><text class="muted" x="108" y="78" text-anchor="middle" font-size="10.5" font-weight="600">First round</text><text class="muted" x="650" y="78" text-anchor="middle" font-size="10.5" font-weight="600">Second round</text><rect x="24" y="92" width="168" height="58" rx="5" fill="#2a78d6" fill-opacity="0.11" stroke="#2a78d6" stroke-opacity="0.72"/><text class="ink" x="108.0" y="117" text-anchor="middle" font-size="12" font-weight="600">Qualified parties</text><text class="muted" x="108.0" y="135" text-anchor="middle" font-size="10">LR, RN+</text><rect x="24" y="181" width="168" height="58" rx="5" fill="#b56824" fill-opacity="0.11" stroke="#b56824" stroke-opacity="0.72"/><text class="ink" x="108.0" y="206" text-anchor="middle" font-size="12" font-weight="600">Eliminated parties</text><text class="muted" x="108.0" y="224" text-anchor="middle" font-size="10">ENS+, NFP+, DVG, DVD, DIV</text><rect x="24" y="270" width="168" height="58" rx="5" fill="#7b818c" fill-opacity="0.11" stroke="#7b818c" stroke-opacity="0.72"/><text class="ink" x="108.0" y="295" text-anchor="middle" font-size="12" font-weight="600">Non-expressed</text><text class="muted" x="108.0" y="313" text-anchor="middle" font-size="10"></text><rect x="578" y="115" width="158" height="70" rx="5" fill="#2a78d6" fill-opacity="0.11" stroke="#2a78d6" stroke-opacity="0.72"/><text class="ink" x="657.0" y="140" text-anchor="middle" font-size="12" font-weight="600">Qualified parties</text><text class="muted" x="657.0" y="158" text-anchor="middle" font-size="10">valid votes</text><rect x="578" y="249" width="158" height="70" rx="5" fill="#7b818c" fill-opacity="0.11" stroke="#7b818c" stroke-opacity="0.72"/><text class="ink" x="657.0" y="274" text-anchor="middle" font-size="12" font-weight="600">Non-expressed</text><text class="muted" x="657.0" y="292" text-anchor="middle" font-size="10">abstention, blank, spoilt</text><path d="M192 111 C340 92 438 101 578 136" fill="none" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arrow-blue)"/><rect class="surface" x="217" y="87" width="156" height="17" opacity="0.92"/><text class="ink" x="295" y="99" text-anchor="middle" font-size="10.5">Loyalty  (1 − d)</text><path d="M192 135 C338 161 440 245 578 271" fill="none" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arrow-blue)"/><rect class="surface" x="208" y="141" width="156" height="17" opacity="0.92"/><text class="ink" x="286" y="153" text-anchor="middle" font-size="10.5">Demobilisation  d</text><path d="M192 202 C343 177 443 158 578 151" fill="none" stroke="#b56824" stroke-width="2.2" marker-end="url(#arrow-orange)"/><rect class="surface" x="214" y="172" width="156" height="17" opacity="0.92"/><text class="ink" x="292" y="184" text-anchor="middle" font-size="10.5">Transfers to qualified candidates</text><path d="M192 226 C340 244 440 273 578 283" fill="none" stroke="#b56824" stroke-width="2.2" marker-end="url(#arrow-orange)"/><rect class="surface" x="219" y="228" width="156" height="17" opacity="0.92"/><text class="ink" x="297" y="240" text-anchor="middle" font-size="10.5">Transfers to NON_EXPR</text><path d="M192 287 C335 278 447 189 578 169" fill="none" stroke="#7b818c" stroke-width="2.2" marker-end="url(#arrow-grey)"/><rect class="surface" x="220" y="260" width="156" height="17" opacity="0.92"/><text class="ink" x="298" y="272" text-anchor="middle" font-size="10.5">Mobilisation</text><path d="M192 310 C340 333 445 324 578 300" fill="none" stroke="#7b818c" stroke-width="2.2" marker-end="url(#arrow-grey)"/><rect class="surface" x="207" y="320" width="156" height="17" opacity="0.92"/><text class="ink" x="285" y="332" text-anchor="middle" font-size="10.5">Retention</text></svg>
