692 votes  →  qualified</text><text class="muted" x="660.0" y="164" text-anchor="middle" font-size="9.4" font-style="italic">derived</text><text class="ink" x="660.0" y="296" text-anchor="middle" font-size="14" font-weight="700">net balance: -5,836votes</text><text class="muted" x="660.0" y="313" text-anchor="middle" font-size="9.8">derived from the four rates alongside</text><line x1="24" y1="390" x2="756" y2="390" class="rule" stroke-width="1"/><text class="muted" x="24" y="409" font-size="9.7" font-style="italic">Boxed: the rate we set. The second-round pool and the balance follow by accounting.</text></svg>
