or="middle" font-size="9.6">30 643 voix</text><text class="muted" x="660.0" y="225" text-anchor="middle" font-size="9.6">44,5 % des inscrits</text><path d="M228 122 C350 122 440 164 562 194" fill="none" class="rule" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect class="surface" x="286.65" y="122" width="158.70000000000002" height="33" rx="5" opacity="0.96"/><text class="ink" x="366" y="136" text-anchor="middle" font-size="10">démobilisation  4,8 %</text><text class="muted" x="366" y="149" text-anchor="middle" font-size="9.4">1 434 voix</text><path d="M228 209 C340 209 450 209 562 210" fill="none" class="rule" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect class="surface" x="242.39999999999998" y="185" width="259.20000000000005" height="33" rx="5" opacity="0.96"/><text class="ink" x="372" y="199" text-anchor="middle" font-size="10">reports vers les non-exprimés  3,2 %</text><text class="muted" x="372" y="212" text-anchor="middle" font-size="9.4">187 voix</text><path d="M228 296 C350 296 440 256 562 232" fill="none" class="rule" stroke-width="1.5" marker-end="url(#flow-arrow)"/><rect class="surface" x="268" y="264" width="168" height="33" rx="5" opacity="0.96"/><text class="ink" x="352" y="278" text-anchor="middle" font-size="10">rétention  <tspan font-style="italic">t</tspan><tspan font-size="7" dy="2.5">NE,NE</tspan><tspan dy="-2.5" dx="3.5">= 87,8 %</tspan></text><text class="muted" x="352" y="291" text-anchor="middle" font-size="9.4">29 022 voix</text><path d="M228 316 C340 342 410 360 496 368" fill="none" class="rule" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#flow-arrow)"/><rect class="surface" x="246.6" y="338" width="178.8" height="33" rx="5" opacity="0.96"/><text class="ink" x="336" y="352" text-anchor="middle" font-size="10">mobilisation  12,2 %</text><text class="muted" x="336" y="365" text-anchor="middle" font-size="9.4">4 026 voix  →  qualifiés</text><text class="accent" x="660.0" y="164" text-anchor="middle" font-size="9.4" font-style="italic">visé</text><text class="ink" x="660.0" y="296" text-anchor="middle" font-size="14" font-weight="700">solde net : -2 405 voix</text><text class="muted" x="660.0" y="313" text-anchor="middle" font-size="9.8">imposé par la cible de participation</text><line x1="24" y1="390" x2="756" y2="390" class="rule" stroke-width="1"/><text class="muted" x="24" y="409" font-size="9.7" font-style="italic">Encadré : le réservoir visé. Tous les flux vers les non-exprimés sont ajustés conjointement.</text></svg>
