<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-label="Étapes d’une simulation, de l’échelle nationale aux circonscriptions puis au nombre de sièges"><style>
    .surface{fill:#fbfbfc}.ink{fill:#16181d}.muted{fill:#5a616e}
    .rule{stroke:#dfe2e8}.grid{stroke:#e8eaee}.frame{fill:none;stroke:#c9cdd5}
    .accent{fill:#432a70}.accent-line{stroke:#432a70}
    @media(prefers-color-scheme:dark){.surface{fill:#14161a}.ink{fill:#e9eaee}
    .muted{fill:#9aa2b1}.rule{stroke:#3a3f49}.grid{stroke:#292d35}.frame{stroke:#555c69}
    .accent{fill:#b09ce8}.accent-line{stroke:#b09ce8}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    </style><style>
        .card{stroke-width:1}
        .hypothesis-card{fill:#efebfa;stroke:#c0b3e0}.hypothesis-bar{fill:#5b3f93}
        .hypothesis-ink{fill:#432a70}
        .data-card{fill:#f2f4f7;stroke:#c9cfd8}.data-bar{fill:#7b8492}
        .data-ink{fill:#646d7a}
        .local-card{fill:#fff5e9;stroke:#e4bc8b}.local-bar{fill:#c77b2b}
        .local-ink{fill:#a45f19}
        .result-card{fill:#eef8ef;stroke:#a8cfaa}.result-bar{fill:#438c4b}
        .result-ink{fill:#34743b}
        .arrow{stroke:#89919e}.input-arrow{stroke:#a0a7b2;stroke-dasharray:4 3}
        .lane{fill:#f7f8fa}.repeat{fill:#efebfa;stroke:#b3a6d8}
        @media(prefers-color-scheme:dark){
          .hypothesis-card{fill:#221a33;stroke:#574a7d}.hypothesis-bar{fill:#b09ce8}
          .hypothesis-ink{fill:#c4b6ef}
          .data-card{fill:#22262d;stroke:#515864}.data-bar{fill:#8993a2}
          .data-ink{fill:#aeb5c0}
          .local-card{fill:#342719;stroke:#7f5a31}.local-bar{fill:#dfa15d}
          .local-ink{fill:#ebb778}
          .result-card{fill:#1c2f20;stroke:#4e7653}.result-bar{fill:#71b879}
          .result-ink{fill:#8bca91}
          .arrow{stroke:#727b89}.input-arrow{stroke:#6b7481}
          .lane{fill:#191c21}.repeat{fill:#221a33;stroke:#7a6ea8}
        }
        </style><defs>
        <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0L10 5L0 10Z" fill="#89919e"/></marker>
        </defs><rect class="surface" width="960" height="760"/><text class="ink" x="28" y="34" font-size="18" font-weight="700">Une simulation, du national aux circonscriptions</text><text class="muted" x="28" y="56" font-size="11.7">Un scénario commun est tiré, adapté aux données locales, puis agrégé en sièges.</text><line x1="28" y1="78" x2="932" y2="78" class="rule" stroke-width="1"/><text class="accent" x="28" y="101" font-size="9.5" font-weight="750" letter-spacing=".9">ÉCHELLE NATIONALE</text><text class="ink" x="230" y="101" font-size="11.5" font-weight="680">Construire un scénario commun</text><text class="muted" x="932" y="101" text-anchor="end" font-size="10">tiré une fois par simulation</text><rect class="lane" x="28" y="115" width="904" height="154" rx="10"/><rect class="card hypothesis-card" x="50" y="136" width="220" height="112" rx="8" stroke-width="1"/><rect class="hypothesis-bar" x="50" y="136" width="5" height="112" rx="2.5"/><text class="ink" x="68" y="165" font-size="13" font-weight="680">Hypothèses choisies</text><text class="muted" x="68" y="194" font-size="10.7">ordres partiels de préférence</text><text class="muted" x="68" y="213" font-size="10.7">plages de valeurs plausibles</text><text class="muted" x="68" y="232" font-size="10.7">structure des variations locales</text><rect class="card hypothesis-card" x="320" y="136" width="260" height="112" rx="8" stroke-width="1"/><rect class="hypothesis-bar" x="320" y="136" width="5" height="112" rx="2.5"/><text x="338" y="165" font-size="13"><tspan class="hypothesis-ink" font-weight="750">1.</tspan> <tspan class="ink" font-weight="680">Tirer un scénario plausible</tspan></text><text class="muted" x="338" y="194" font-size="10.7">tirer une valeur pour chaque paramètre</text><text class="muted" x="338" y="213" font-size="10.7">départager au hasard les ex æquo</text><text class="muted" x="338" y="232" font-size="10.7">garder un même scénario national</text><rect class="card hypothesis-card" x="630" y="136" width="270" height="112" rx="8" stroke-width="1"/><rect class="hypothesis-bar" x="630" y="136" width="5" height="112" rx="2.5"/><text x="648" y="165" font-size="13"><tspan class="hypothesis-ink" font-weight="750">2.</tspan> <tspan class="ink" font-weight="680">Construire le scénario national</tspan></text><text class="muted" x="648" y="194" font-size="10.7">calculer les probabilités de report</text><text class="muted" x="648" y="213" font-size="10.7">fixer l’évolution de la participation</text><text class="muted" x="648" y="232" font-size="10.7">former une référence nationale commune</text><line x1="276" y1="192" x2="309" y2="192" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><line x1="586" y1="192" x2="619" y2="192" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><line x1="28" y1="287" x2="932" y2="287" class="rule" stroke-width="1"/><text class="accent" x="28" y="310" font-size="9.5" font-weight="750" letter-spacing=".9">ÉCHELLE LOCALE</text><text class="ink" x="230" y="310" font-size="11.5" font-weight="680">Adapter et simuler les voix</text><text class="muted" x="932" y="310" text-anchor="end" font-size="10">répété dans chacune des 501 circonscriptions</text><rect class="lane" x="28" y="324" width="904" height="258" rx="10"/><rect class="card data-card" x="50" y="338" width="850" height="76" rx="8" stroke-width="1"/><rect class="data-bar" x="50" y="338" width="5" height="76" rx="2.5"/><text class="ink" x="70" y="368" font-size="12.5" font-weight="680">Entrées de chaque circonscription</text><text class="muted" x="70" y="390" font-size="9.8">un scénario simulé + les données observées</text><rect class="hypothesis-card" x="292" y="353" width="132" height="40" rx="20"/><text class="hypothesis-ink" x="358" y="377" text-anchor="middle" font-size="9.5" font-weight="650">scénario national</text><rect class="surface" x="440" y="353" width="136" height="40" rx="20"/><text class="data-ink" x="508" y="377" text-anchor="middle" font-size="9.3" font-weight="650">candidats au 2e tour</text><rect class="surface" x="592" y="353" width="136" height="40" rx="20"/><text class="data-ink" x="660" y="371" text-anchor="middle" font-size="9.1" font-weight="650">participation</text><text class="data-ink" x="660" y="383" text-anchor="middle" font-size="8.8">du premier tour</text><rect class="surface" x="744" y="353" width="136" height="40" rx="20"/><text class="data-ink" x="812" y="371" text-anchor="middle" font-size="9.1" font-weight="650">réservoirs de voix</text><text class="data-ink" x="812" y="383" text-anchor="middle" font-size="8.8">du premier tour</text><rect class="card local-card" x="50" y="444" width="260" height="116" rx="8" stroke-width="1"/><rect class="local-bar" x="50" y="444" width="5" height="116" rx="2.5"/><text x="68" y="473" font-size="13"><tspan class="local-ink" font-weight="750">3.</tspan> <tspan class="ink" font-weight="680">Adapter à la circonscription</tspan></text><text class="muted" x="68" y="502" font-size="10.7">conserver les candidats présents</text><text class="muted" x="68" y="521" font-size="10.7">ajouter un écart géographique local</text><text class="muted" x="68" y="540" font-size="10.7">obtenir les reports locaux</text><rect class="card local-card" x="350" y="444" width="260" height="116" rx="8" stroke-width="1"/><rect class="local-bar" x="350" y="444" width="5" height="116" rx="2.5"/><text x="368" y="473" font-size="13"><tspan class="local-ink" font-weight="750">4.</tspan> <tspan class="ink" font-weight="680">Ancrer la participation</tspan></text><text class="muted" x="368" y="502" font-size="10.7">partir du taux du premier tour</text><text class="muted" x="368" y="521" font-size="10.7">ajouter une évolution nationale</text><text class="muted" x="368" y="540" font-size="10.7">ajuster les flux non exprimés</text><rect class="card local-card" x="650" y="444" width="250" height="116" rx="8" stroke-width="1"/><rect class="local-bar" x="650" y="444" width="5" height="116" rx="2.5"/><text x="668" y="473" font-size="13"><tspan class="local-ink" font-weight="750">5.</tspan> <tspan class="ink" font-weight="680">Simuler les voix</tspan></text><text class="muted" x="668" y="502" font-size="10.7">répartir chaque réservoir</text><text class="muted" x="668" y="521" font-size="10.7">additionner les voix par candidat</text><text class="muted" x="668" y="540" font-size="10.7">désigner le vainqueur local</text><path d="M765 248 V275 H205 V327" fill="none" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><path d="M180 414 L180 433" fill="none" class="input-arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><path d="M480 414 L480 433" fill="none" class="input-arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><path d="M775 414 L775 433" fill="none" class="input-arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><line x1="316" y1="502" x2="339" y2="502" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><line x1="616" y1="502" x2="639" y2="502" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><line x1="28" y1="600" x2="932" y2="600" class="rule" stroke-width="1"/><text class="accent" x="28" y="623" font-size="9.5" font-weight="750" letter-spacing=".9">RETOUR AU NATIONAL</text><text class="ink" x="230" y="623" font-size="11.5" font-weight="680">Produire une projection en sièges</text><text class="muted" x="932" y="623" text-anchor="end" font-size="10">une sortie complète par simulation</text><rect class="card result-card" x="180" y="643" width="390" height="82" rx="8" stroke-width="1"/><rect class="result-bar" x="180" y="643" width="5" height="82" rx="2.5"/><text x="198" y="672" font-size="13"><tspan class="result-ink" font-weight="750">6.</tspan> <tspan class="ink" font-weight="680">Agréger les 501 vainqueurs</tspan></text><text class="muted" x="198" y="701" font-size="10.7">compter les sièges obtenus par chaque groupe politique</text><path d="M775 560 V588 H205 V632" fill="none" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/><rect class="repeat" x="614" y="650" width="286" height="66" rx="33" stroke-width="1"/><text class="hypothesis-ink" x="757" y="676" text-anchor="middle" font-size="11.2" font-weight="700">Répéter 3 000 fois</text><text class="muted" x="757" y="697" text-anchor="middle" font-size="10.2">distribution et intervalles prédictifs</text><line x1="576" y1="684" x2="603" y2="684" class="arrow" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/></svg>
