<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Simulation séparée entre échelles nationale et locale"><style>
    .surface{fill:#fbfbfc}.ink{fill:#16181d}.muted{fill:#5a616e}
    .rule{stroke:#dfe2e8}.grid{stroke:#e8eaee}.frame{fill:none;stroke:#c9cdd5}
    @media(prefers-color-scheme:dark){.surface{fill:#14161a}.ink{fill:#e9eaee}
    .muted{fill:#9aa2b1}.rule{stroke:#3a3f49}.grid{stroke:#292d35}.frame{stroke:#555c69}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    </style><defs>
        <marker id="arrow-7057c7" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7057c7"/></marker>
        <marker id="arrow-1f8a70" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f8a70"/></marker>
        <marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a78d6"/></marker>
        </defs><rect class="surface" width="900" height="650"/><text class="ink" x="24" y="29" font-size="17" font-weight="650">Une simulation, à deux échelles</text><text class="muted" x="24" y="49" font-size="11.5">L’incertitude commune est tirée une fois ; les opérations locales sont ensuite répétées dans chaque circonscription.</text><rect x="24" y="68" width="852" height="184" rx="11" fill="#7057c7" fill-opacity="0.07"/><text x="42" y="91" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#7057c7">UNE FOIS PAR SIMULATION · ÉCHELLE NATIONALE</text><text class="muted" x="852" y="91" text-anchor="end" font-size="9.5">partagé par toutes les circonscriptions</text><rect x="24" y="269" width="852" height="200" rx="11" fill="#1f8a70" fill-opacity="0.07"/><text x="42" y="293" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#1f8a70">RÉPÉTÉ DANS CHAQUE CIRCONSCRIPTION · ÉCHELLE LOCALE</text><text class="muted" x="852" y="293" text-anchor="end" font-size="9.5">une fois par circonscription simulée</text><rect class="surface" x="56" y="108" width="250" height="122" rx="8" stroke="#7057c7" stroke-opacity="0.42"/><circle cx="76" cy="129" r="13" fill="#7057c7"/><text x="76" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="white">1</text><text class="ink" x="98" y="134" font-size="12.3" font-weight="650">Paramètres globaux</text><text class="muted" x="74" y="161" font-size="10.2">alpha règle la dispersion des reports</text><text class="muted" x="74" y="178" font-size="10.2">le tilt répartit la remobilisation</text><text class="muted" x="74" y="195" font-size="10.2">démobilisation ; rétention (modèle national)</text><text class="muted" x="74" y="212" font-size="10.2">lambda dose national / local (noyau)</text><rect class="surface" x="325" y="108" width="250" height="122" rx="8" stroke="#7057c7" stroke-opacity="0.42"/><circle cx="345" cy="129" r="13" fill="#7057c7"/><text x="345" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="white">2</text><text class="ink" x="367" y="134" font-size="12.3" font-weight="650">Ordres de préférence</text><text class="muted" x="343" y="161" font-size="10.2">un ordre partiel par parti source</text><text class="muted" x="343" y="178" font-size="10.2">NFP+ : DVG  ›  ENS+  ›  4 choix ex æquo</text><text class="muted" x="343" y="195" font-size="10.2">permutation aléatoire des seuls ex æquo</text><text class="muted" x="343" y="212" font-size="10.2">un tirage : DVG  ›  ENS+  ›  LR  ›  …</text><rect class="surface" x="594" y="108" width="250" height="122" rx="8" stroke="#7057c7" stroke-opacity="0.42"/><circle cx="614" cy="129" r="13" fill="#7057c7"/><text x="614" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="white">3</text><text class="ink" x="636" y="134" font-size="12.3" font-weight="650">Composante commune</text><text class="muted" x="612" y="161" font-size="10.2">national : une uniforme par cellule</text><text class="muted" x="612" y="178" font-size="10.2">noyau : un facteur gaussien par cellule</text><text class="muted" x="612" y="195" font-size="10.2">un même tirage pour toutes les circonscriptions</text><text class="muted" x="612" y="212" font-size="10.2">les cellules sont tirées indépendamment</text><line x1="307" y1="169" x2="320" y2="169" stroke="#7057c7" stroke-opacity="0.7" stroke-width="1.7" marker-end="url(#arrow-7057c7)"/><line x1="576" y1="169" x2="589" y2="169" stroke="#7057c7" stroke-opacity="0.7" stroke-width="1.7" marker-end="url(#arrow-7057c7)"/><rect class="surface" x="594" y="310" width="250" height="122" rx="8" stroke="#1f8a70" stroke-opacity="0.42"/><circle cx="614" cy="331" r="13" fill="#1f8a70"/><text x="614" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="white">4</text><text class="ink" x="636" y="336" font-size="12.3" font-weight="650">Taux de report locaux</text><text class="muted" x="612" y="363" font-size="10.2">noyau : ajouter un écart local corrélé</text><text class="muted" x="612" y="380" font-size="10.2">transformer en poids Gamma</text><text class="muted" x="612" y="397" font-size="10.2">classer les parts soumises à l’ordre</text><text class="muted" x="612" y="414" font-size="10.2">normaliser chaque ligne à 100 %</text><rect class="surface" x="325" y="310" width="250" height="122" rx="8" stroke="#1f8a70" stroke-opacity="0.42"/><circle cx="345" cy="331" r="13" fill="#1f8a70"/><text x="345" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="white">5</text><text class="ink" x="367" y="336" font-size="12.3" font-weight="650">Bulletin et participation</text><text class="muted" x="343" y="363" font-size="10.2">ne garder que les candidats qualifiés</text><text class="muted" x="343" y="380" font-size="10.2">renormaliser les destinations restantes</text><text class="muted" x="343" y="397" font-size="10.2">ajouter rétention et non-expression</text><text class="muted" x="343" y="414" font-size="10.2">ancré : résoudre les flux depuis la cible</text><rect class="surface" x="56" y="310" width="250" height="122" rx="8" stroke="#1f8a70" stroke-opacity="0.42"/><circle cx="76" cy="331" r="13" fill="#1f8a70"/><text x="76" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="white">6</text><text class="ink" x="98" y="336" font-size="12.3" font-weight="650">Voix et vainqueur local</text><text class="muted" x="74" y="363" font-size="10.2">prendre chaque réservoir du premier tour</text><text class="muted" x="74" y="380" font-size="10.2">ventiler ses voix par une multinomiale</text><text class="muted" x="74" y="397" font-size="10.2">additionner les voix par destination</text><text class="muted" x="74" y="414" font-size="10.2">le candidat arrivé en tête gagne</text><line x1="589" y1="371" x2="580" y2="371" stroke="#1f8a70" stroke-opacity="0.7" stroke-width="1.7" marker-end="url(#arrow-1f8a70)"/><line x1="320" y1="371" x2="311" y2="371" stroke="#1f8a70" stroke-opacity="0.7" stroke-width="1.7" marker-end="url(#arrow-1f8a70)"/><path d="M181 432 C181 483 247 497 267 511" fill="none" stroke="#2a78d6" stroke-opacity="0.7" stroke-width="1.8" marker-end="url(#arrow-2a78d6)"/><rect x="272" y="501" width="356" height="84" rx="10" fill="#2a78d6" fill-opacity="0.09" stroke="#2a78d6" stroke-opacity="0.48"/><circle cx="296" cy="525" r="13" fill="#2a78d6"/><text x="296" y="529" text-anchor="middle" font-size="10" font-weight="700" fill="white">7</text><text class="ink" x="318" y="530" font-size="12.5" font-weight="650">Retour à l’échelle nationale</text><text class="muted" x="296" y="555" font-size="10.5">Compter les vainqueurs locaux par parti donne un vecteur de sièges.</text><text class="muted" x="296" y="572" font-size="10.2">Il s’agit d’un tirage de la distribution jointe nationale.</text><path d="M719 230 C719 269 719 280 719 303" fill="none" stroke="#1f8a70" stroke-opacity="0.65" stroke-width="1.8" marker-end="url(#arrow-1f8a70)"/><text class="muted" x="730" y="275" font-size="9.3">entrée dans la boucle locale</text><text class="muted" x="450" y="632" text-anchor="middle" font-size="10">Répéter la simulation complète permet d’approcher la distribution prédictive jointe des sièges.</text></svg>
