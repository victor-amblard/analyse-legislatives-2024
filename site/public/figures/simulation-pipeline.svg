<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Simulation séparée entre échelles nationale et locale"><style>
    .surface{fill:#fbfbfc}.ink{fill:#16181d}.muted{fill:#5a616e}
    .rule{stroke:#dfe2e8}.grid{stroke:#e8eaee}.frame{fill:none;stroke:#c9cdd5}
    .accent{fill:#1f6f6b}.accent-line{stroke:#1f6f6b}
    @media(prefers-color-scheme:dark){.surface{fill:#14161a}.ink{fill:#e9eaee}
    .muted{fill:#9aa2b1}.rule{stroke:#3a3f49}.grid{stroke:#292d35}.frame{stroke:#555c69}
    .accent{fill:#5cb8b1}.accent-line{stroke:#5cb8b1}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    </style><defs>
        <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0L10 5L0 10Z" class="muted"/></marker>
        </defs><rect class="surface" width="900" height="650"/><text class="ink" x="24" y="29" font-size="17" font-weight="650">Une simulation, à deux échelles</text><text class="muted" x="24" y="49" font-size="11.5">L’incertitude commune est tirée une fois ; les opérations locales sont ensuite répétées dans chaque circonscription.</text><line x1="24" y1="76" x2="876" y2="76" class="rule" stroke-width="1"/><text class="ink" x="24" y="94" font-size="11" font-weight="650">Tiré une fois par simulation</text><text class="muted" x="852" y="94" text-anchor="end" font-size="9.5">partagé, ou dosé avec le local selon le noyau</text><line x1="24" y1="277" x2="876" y2="277" class="rule" stroke-width="1"/><text class="ink" x="24" y="295" font-size="11" font-weight="650">Répété dans chaque circonscription — échelle locale</text><text class="muted" x="852" y="295" text-anchor="end" font-size="9.5">une fois par circonscription simulée</text><rect class="frame" x="56" y="116" width="250" height="122" rx="6" stroke-width="1"/><text x="70" y="141" font-size="12.3"><tspan class="accent" font-weight="700">1.</tspan> <tspan class="ink" font-weight="650">Paramètres globaux</tspan></text><text class="muted" x="70" y="169" font-size="10.2">alpha règle la dispersion des reports</text><text class="muted" x="70" y="186" font-size="10.2">tilt : remobilisation, locale sous noyau</text><text class="muted" x="70" y="203" font-size="10.2">démobilisation ; rétention (modèle national)</text><text class="muted" x="70" y="220" font-size="10.2">lambda, 2 rho (dépt/région) dosent le noyau</text><rect class="frame" x="325" y="116" width="250" height="122" rx="6" stroke-width="1"/><text x="339" y="141" font-size="12.3"><tspan class="accent" font-weight="700">2.</tspan> <tspan class="ink" font-weight="650">Ordres de préférence</tspan></text><text class="muted" x="339" y="169" font-size="10.2">un ordre partiel par parti source</text><text class="muted" x="339" y="186" font-size="10.2">NFP+ : DVG  ›  ENS+  ›  2 choix ex æquo  ›  …</text><text class="muted" x="339" y="203" font-size="10.2">ex æquo : permutation nationale ou locale</text><text class="muted" x="339" y="220" font-size="10.2">un tirage : DVG  ›  ENS+  ›  DVD  ›  …</text><rect class="frame" x="594" y="116" width="250" height="122" rx="6" stroke-width="1"/><text x="608" y="141" font-size="12.3"><tspan class="accent" font-weight="700">3.</tspan> <tspan class="ink" font-weight="650">Composante commune</tspan></text><text class="muted" x="608" y="169" font-size="10.2">national : une uniforme par cellule</text><text class="muted" x="608" y="186" font-size="10.2">noyau : un facteur gaussien par cellule</text><text class="muted" x="608" y="203" font-size="10.2">un même tirage pour toutes les circonscriptions</text><text class="muted" x="608" y="220" font-size="10.2">les cellules sont tirées indépendamment</text><line x1="307" y1="177" x2="320" y2="177" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><line x1="576" y1="177" x2="589" y2="177" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><rect class="frame" x="594" y="318" width="250" height="122" rx="6" stroke-width="1"/><text x="608" y="343" font-size="12.3"><tspan class="accent" font-weight="700">4.</tspan> <tspan class="ink" font-weight="650">Taux de report locaux</tspan></text><text class="muted" x="608" y="371" font-size="10.2">noyau : ajouter un écart local corrélé</text><text class="muted" x="608" y="388" font-size="10.2">transformer en poids Gamma</text><text class="muted" x="608" y="405" font-size="10.2">classer les parts soumises à l’ordre</text><text class="muted" x="608" y="422" font-size="10.2">normaliser chaque ligne à 100 %</text><rect class="frame" x="325" y="318" width="250" height="122" rx="6" stroke-width="1"/><text x="339" y="343" font-size="12.3"><tspan class="accent" font-weight="700">5.</tspan> <tspan class="ink" font-weight="650">Bulletin et participation</tspan></text><text class="muted" x="339" y="371" font-size="10.2">ne garder que les candidats qualifiés</text><text class="muted" x="339" y="388" font-size="10.2">renormaliser les destinations restantes</text><text class="muted" x="339" y="405" font-size="10.2">ajouter rétention et non-expression</text><text class="muted" x="339" y="422" font-size="10.2">ancré : cible nationale + écart local corrélé</text><rect class="frame" x="56" y="318" width="250" height="122" rx="6" stroke-width="1"/><text x="70" y="343" font-size="12.3"><tspan class="accent" font-weight="700">6.</tspan> <tspan class="ink" font-weight="650">Voix et vainqueur local</tspan></text><text class="muted" x="70" y="371" font-size="10.2">prendre chaque réservoir du premier tour</text><text class="muted" x="70" y="388" font-size="10.2">ventiler ses voix par une multinomiale</text><text class="muted" x="70" y="405" font-size="10.2">additionner les voix par destination</text><text class="muted" x="70" y="422" font-size="10.2">le candidat arrivé en tête gagne</text><line x1="589" y1="379" x2="580" y2="379" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><line x1="320" y1="379" x2="311" y2="379" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><path d="M181 440 C181 491 247 505 267 519" fill="none" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><rect x="272" y="509" width="356" height="84" rx="6" class="frame" stroke-width="1"/><text x="286" y="533" font-size="12.5"><tspan class="accent" font-weight="700">7.</tspan> <tspan class="ink" font-weight="650">Retour à l’échelle nationale</tspan></text><text class="muted" x="286" y="558" font-size="10.5">Compter les vainqueurs locaux par parti donne un vecteur de sièges.</text><text class="muted" x="286" y="575" font-size="10.2">Il s’agit d’un tirage de la distribution jointe nationale.</text><path d="M719 238 C719 277 719 288 719 311" fill="none" class="rule" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/><text class="muted" x="730" y="283" font-size="9.3">entrée dans la boucle locale</text><text class="muted" x="450" y="632" text-anchor="middle" font-size="10">Répéter la simulation complète permet d’approcher la distribution prédictive jointe des sièges.</text></svg>
