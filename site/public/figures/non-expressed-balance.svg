<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Solde du réservoir des non-exprimés entre les deux tours, circonscription 5908"><style>
    .surface{fill:#fbfbfc}.ink{fill:#16181d}.muted{fill:#5a616e}
    .rule{stroke:#dfe2e8}.grid{stroke:#e8eaee}.frame{fill:none;stroke:#c9cdd5}
    .accent{fill:#1f6f6b}.accent-line{stroke:#1f6f6b}
    @media(prefers-color-scheme:dark){.surface{fill:#14161a}.ink{fill:#e9eaee}
    .muted{fill:#9aa2b1}.rule{stroke:#3a3f49}.grid{stroke:#292d35}.frame{stroke:#555c69}
    .accent{fill:#5cb8b1}.accent-line{stroke:#5cb8b1}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    </style><defs>
        <marker id="balance-arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0L10 5L0 10Z" class="muted"/></marker>
        <marker id="balance-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0L10 5L0 10Z" class="accent"/></marker>
        </defs><rect class="surface" width="760" height="380"/><text class="ink" x="24" y="29" font-size="17" font-weight="650">Non-exprimés : ce qui sort, ce qui entre, ce qui reste</text><text class="muted" x="24" y="49" font-size="11.5">Circonscription 5908 (Nord) — duel NFP+ / RN+, 2nd tour réel</text><text class="muted" x="60" y="66" font-size="10">sortie : mobilisation → qualifiés</text><path d="M150 128 C155 105 130 90 100 82" fill="none" class="muted" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#balance-arrow)"/><text class="muted" x="700" y="66" text-anchor="end" font-size="10">démobilisation → non-exprimés : entrée</text><path d="M660 82 C630 90 605 105 610 128" fill="none" class="muted" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#balance-arrow)"/><rect class="frame" x="40" y="128" width="200" height="96" rx="6" stroke-width="1"/><text class="ink" x="140.0" y="152" text-anchor="middle" font-size="12" font-weight="650">Non-exprimés — 1er tour</text><text class="accent" x="140.0" y="182" text-anchor="middle" font-size="19" font-weight="700">33 048 voix</text><text class="muted" x="140.0" y="204" text-anchor="middle" font-size="11">47.9 % des inscrits</text><rect class="frame" x="520" y="128" width="200" height="96" rx="6" stroke-width="1"/><text class="ink" x="620.0" y="152" text-anchor="middle" font-size="12" font-weight="650">Non-exprimés — 2nd tour (réel)</text><text class="accent" x="620.0" y="182" text-anchor="middle" font-size="19" font-weight="700">34 629 voix</text><text class="muted" x="620.0" y="204" text-anchor="middle" font-size="11">50.2 % des inscrits</text><line x1="246" y1="222.0" x2="514" y2="222.0" class="accent-line" stroke-width="2.4" marker-end="url(#balance-arrow-accent)"/><text class="accent" x="380" y="210.0" text-anchor="middle" font-size="13" font-weight="700">solde net observé : +1 581 voix (+2,3 pts)</text><text class="muted" x="380" y="242.0" text-anchor="middle" font-size="10.5">le réservoir grossit légèrement, malgré sa taille : la participation n’a pas rebondi</text><line x1="24" y1="264.0" x2="736" y2="264.0" class="rule" stroke-width="1"/><text class="muted" x="24" y="284.0" font-size="10" font-style="italic">Les flux bruts (qui se mobilise, qui démobilise) ne sont pas identifiables séparément à partir des seuls résultats agrégés — seul le solde l’est.</text><text class="muted" x="24" y="304.0" font-size="10">Pour comparer : un modèle qui suppose la mobilisation proportionnelle au réservoir (sans ancrage) aurait prédit un solde de</text><text class="muted" x="24" y="321.0" font-size="10">-3 651 voix — de sens opposé, et bien plus large.</text></svg>
