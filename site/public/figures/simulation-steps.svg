ll="#0b5394" opacity="0.62"/><rect x="482" y="396.5" width="11" height="1.5" fill="#0b5394" opacity="0.62"/><rect x="495" y="397.7" width="11" height="0.3" fill="#0b5394" opacity="0.62"/><line class="faint" x1="326" y1="398" x2="508" y2="398"/><line class="hair" x1="350" y1="346" x2="350" y2="398" stroke-width="1.5"/><text class="ink" x="346" y="338" font-size="9" font-weight="700">résultat réel</text><text class="ink" x="326" y="422" font-size="10.5" font-weight="600">RN+ gagne 34 % des 3 000 tirages</text><text class="muted" x="326" y="436" font-size="9.5">LR l’a emporté, avec 33 889 voix contre 26 116</text></g><line class="faint" x1="18" y1="494" x2="868" y2="494"/><text class="muted" x="18" y="514" font-size="10.5">Les étapes 1 et 2 ont lieu une fois par simulation ; les étapes 3 et 4 dans les 501 circonscriptions. Les tirages favorisent RN+, mais LR a gagné :</text><text class="muted" x="18" y="528" font-size="10.5">c’est la même surestimation de l’extrême droite que celle analysée dans la section des résultats.</text></svg>
