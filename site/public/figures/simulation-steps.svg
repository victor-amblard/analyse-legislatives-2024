    </style><rect class="surface" width="886" height="536"/><text class="ink" x="18" y="32" font-size="15" font-weight="600">Circonscription 0101 — 1re circonscription</text><text class="muted" x="18" y="54" font-size="11.5">RN+ arrive en tête au premier tour, avec 23 819 voix contre 14 495. Principaux réservoirs : 26 348 NON_EXPRIMES, 14 607 NFP+, 7 063 ENS+.</text><text class="muted" x="18" y="72" font-size="11.5">Valeurs issues des fichiers électoraux et d’un tirage reproductible du modèle national.</text><g class="on0"><line class="hair" x1="18" y1="88" x2="284" y2="88"/><text class="accent" x="18" y="104" font-size="10.5" font-weight="700">1.</text><text class="ink" x="34" y="104" font-size="12" font-weight="600">Tirer une matrice</text><text class="muted" x="34" y="119" font-size="10">une seule Θ pour toute la France</text><text class="muted" x="34" y="145" font-size="8.5" opacity="1">DIV</text><rect x="118" y="138" width="41.9" height="8" fill="#8e7cc3" opacity="1"/><text class="muted" x="164" y="145" font-size="8.5" opacity="1">0.403</text><text class="muted" x="34" y="158" font-size="8.5" opacity="1">DVG</text><rect x="118" y="151" width="35.2" height="8" fill="#ea9999" opacity="1"/><text class="muted" x="157" y="158" font-size="8.5" opacity="1">0.338</text><text class="muted" x="34" y="171" font-size="8.5" opacity="1">ENS+</text><rect x="118" y="164" width="18.8" height="8" fill="#f1c232" opacity="1"/><text class="muted" x="141" y="171" font-size="8.5" opacity="1">0.181</text><text class="muted" x="34" y="184" font-size="8.5" opacity="1">DVD</text><rect x="118" y="177" width="6.5" height="8" fill="#9fc5e8" opacity="1"/><text class="muted" x="129" y="184" font-size="8.5" opacity="1">0.063</text><text class="muted" x="34" y="197" font-size="8.5" opacity="1">LR</text><rect x="118" y="190" width="1.5" height="8" fill="#0086ff" opacity="1"/><text class="muted" x="124" y="197" font-size="8.5" opacity="1">0.008</text><text class="muted" x="34" y="210" font-size="