    </style><rect class="surface" width="886" height="536"/><text class="ink" x="18" y="32" font-size="15" font-weight="600">Circonscription 0101 — 1ère circonscription</text><text class="muted" x="18" y="54" font-size="11.5">RN+ finished the first round ahead, 23,819 to 14,495. Main reservoirs: 26,348 NON_EXPRIMES, 14,607 NFP+, 7,063 ENS+.</text><text class="muted" x="18" y="72" font-size="11.5">Values are loaded from the election files and a reproducible national draw.</text><g class="on0"><line class="hair" x1="18" y1="88" x2="284" y2="88"/><text class="muted" x="18" y="104" font-size="10.5">1</text><text class="ink" x="34" y="104" font-size="12" font-weight="600">Draw a matrix</text><text class="muted" x="34" y="119" font-size="10">one Θ for the whole country</text><text class="muted" x="34" y="145" font-size="8.5" opacity="1">DIV</text><rect x="118" y="138" width="41.9" height="8" fill="#8e7cc3" opacity="1"/><text class="muted" x="164" y="145" font-size="8.5" opacity="1">0.403</text><text class="muted" x="34" y="158" font-size="8.5" opacity="1">DVG</text><rect x="118" y="151" width="35.2" height="8" fill="#ea9999" opacity="1"/><text class="muted" x="157" y="158" font-size="8.5" opacity="1">0.338</text><text class="muted" x="34" y="171" font-size="8.5" opacity="1">ENS+</text><rect x="118" y="164" width="18.8" height="8" fill="#f1c232" opacity="1"/><text class="muted" x="141" y="171" font-size="8.5" opacity="1">0.181</text><text class="muted" x="34" y="184" font-size="8.5" opacity="1">LR</text><rect x="118" y="177" width="6.5" height="8" fill="#0086ff" opacity="1"/><text class="muted" x="129" y="184" font-size="8.5" opacity="1">0.063</text><text class="muted" x="34" y="197" font-size="8.5" opacity="1">NON_EXPRIMES</text><rect x="118" y="190" width="1.5" height="8" fill="#8a9099" opacity="1"/><text class="muted" x="124" y="197" font-size="8.5" opacity="1">0.008</text><text class="muted" x="34" y="210" font-size="8.5" opacity="1">DVD</text><rect x="118" y="203" width="1.5" height="8" fill="#9fc5e8" opacity="1"/><text class="muted" x="124" y="210" font-size="8.5" opacity="1">0.005</text><text class="muted" x="34" y="223" font-size="8.5" opacity="1">RN+</text><rect x="118" y="216" width="1.5" height="8" fill="#0b5394" opacity="1"/><text class="muted" x="124" y="223" font-size="8.5" opacity="1">0.003</text></g><g class="on1"><line class="hair" x1="310" y1="88" x2="576" y2="88"/><text class="muted" x="310" y="104" font-size="10.5">2</text><text class="ink" x="326" y="104" font-size="12" font-weight="600">Keep what is on the ballot</text><text class="muted" x="326" y="119" font-size="10">five of eight columns go</text><text class="muted" x="326" y="145" font-size="8.5" opacity="0.22">DIV</text><rect x="410" y="138" width="41.9" height="8" fill="#aeb4bd" opacity="0.22"/><text class="muted" x="456" y="145" font-size="8.5" opacity="0.22">0.403</text><text class="muted" x="326" y="158" font-size="8.5" opacity="0.22">DVG</text><rect x="410" y="151" width="35.2" height="8" fill="#aeb4bd" opacity="0.22"/><text class="muted" x="449" y="158" font-size="8.5" opacity="0.22">0.338</text><text class="muted" x="326" y="171" font-size="8.5" opacity="0.22">ENS+</text><rect x="410" y="164" width="18.8" height="8" fill="#aeb4bd" opacity="0.22"/><text class="muted" x="433" y="171" font-size="8.5" opacity="0.22">0.181</text><text class="muted" x="326" y="184" font-size="8.5" opacity="1">LR</text><rect x="410" y="177" width="6.5" height="8" fill="#0086ff" opacity="1"/><text class="muted" x="421" y="184" font-size="8.5" opacity="1">0.063</text><text class="muted" x="326" y="197" font-size="8.5" opacity="1">NON_EXPRIMES</text><rect x="410" y="190" width="1.5" height="8" fill="#8a9099" opacity="1"/><text class="muted" x="416" y="197" font-size="8.5" opacity="1">0.008</text><text class="muted" x="326" y="210" font-size="8.5" opacity="0.22">DVD</text><rect x="410" y="203" width="1.5" height="8" fill="#aeb4bd" opacity="0.22"/><text class="muted" x="416" y="210" font-size="8.5" opacity="0.22">0.005</text><text class="muted" x="326" y="223" font-size="8.5" opacity="1">RN+</text><rect x="410" y="216" width="1.5" height="8" fill="#0b5394" opacity="1"/><text class="muted" x="416" y="223" font-size="8.5" opacity="1">0.003</text><text class="ink" x="326" y="242" font-size="10" font-weight="600">LR</text><text class="ink" x="420" y="242" font-size="10">0.86</text><text class="ink" x="326" y="256" font-size="10" font-weight="600">RN+</text><text class="ink" x="420" y="256" font-size="10">0.04</text><text class="ink" x="326" y="270" font-size="10" font-weight="600">NON_EXPRIMES</text><text class="ink" x="420" y="270" font-size="10">0.10</text><text class="muted" x="456" y="242" font-size="9">renormalised</text></g><g class="on2"><line class="hair" x1="602" y1="88" x2="868" y2="88"/><text class="muted" x="602" y="104" font-size="10.5">3</text><text class="ink" x="618" y="104" font-size="12" font-weight="600">Split each reservoir</text><text class="muted" x="618" y="119" font-size="10">a multinomial draw</text><text class="muted" x="618" y="138" font-size="9">the NFP+ reservoir, 14,607 voters</text><text class="muted" x="618" y="166" font-size="9.5">LR</text><rect x="702" y="154" width="92" height="15" fill="#0086ff"/><text class="ink" x="800" y="166" font-size="10">12,549</text><text class="muted" x="618" y="190" font-size="9.5">RN+</text><rect x="702" y="178" width="4" height="15" fill="#0b5394"/><text class="ink" x="712" y="190" font-size="10">608</text><text class="muted" x="618" y="214" font-size="9.5">NON_EXPRIMES</text><rect x="702" y="202" width="11" height="15" fill="#8a9099"/><text class="ink" x="719" y="214" font-size="10">1,450</text><text class="muted" x="618" y="242" font-size="9.5">the other reservoirs split the same way</text></g><g class="on3"><line class="hair" x1="18" y1="290" x2="284" y2="290"/><text class="muted" x="18" y="306" font-size="10.5">4</text><text class="ink" x="34" y="306" font-size="12" font-weight="600">Count</text><text class="muted" x="34" y="321" font-size="10">the seat goes to whoever leads</text><rect x="34" y="352" width="132" height="19" fill="#0086ff"/><text class="ink" x="34" y="348" font-size="10" font-weight="600">LR</text><text class="ink" x="172" y="366" font-size="10.5">33,813</text><rect x="34" y="392" width="108" height="19" fill="#0b5394"/><text class="ink" x="34" y="388" font-size="10" font-weight="600">RN+</text><text class="ink" x="148" y="406" font-size="10.5">27,770</text><text class="muted" x="34" y="440" font-size="9.5">in this draw the seat goes to LR</text></g><g class="on4"><line class="hair" x1="310" y1="290" x2="576" y2="290"/><text class="muted" x="310" y="306" font-size="10.5">5</text><text class="ink" x="326" y="306" font-size="12" font-weight="600">Do it again</text><text class="muted" x="326" y="321" font-size="10">and again, and again</text><rect x="326" y="392.6" width="11" height="5.4" fill="#0b5394" opacity="0.62"/><rect x="339" y="370.0" width="11" height="28.0" fill="#0b5394" opacity="0.62"/><rect x="352" y="353.4" width="11" height="44.6" fill="#0b5394" opacity="0.62"/><rect x="365" y="345.9" width="11" height="52.1" fill="#0b5394" opacity="0.62"/><rect x="378" y="343.0" width="11" height="55.0" fill="#0b5394" opacity="0.62"/><rect x="391" y="348.0" width="11" height="50.0" fill="#0b5394" opacity="0.62"/><rect x="404" y="350.7" width="11" height="47.3" fill="#0b5394" opacity="0.62"/><rect x="417" y="361.3" width="11" height="36.7" fill="#0b5394" opacity="0.62"/><rect x="430" y="368.7" width="11" height="29.3" fill="#0b5394" opacity="0.62"/><rect x="443" y="378.1" width="11" height="19.9" fill="#0b5394" opacity="0.62"/><rect x="456" y="386.8" width="11" height="11.2" fill="#0b5394" opacity="0.62"/><rect x="469" y="393.8" width="11" height="4.2" fill="#0b5394" opacity="0.62"/><rect x="482" y="396.8" width="11" height="1.2" fill="#0b5394" opacity="0.62"/><rect x="495" y="396.8" width="11" height="1.2" fill="#0b5394" opacity="0.62"/><line class="faint" x1="326" y1="398" x2="508" y2="398"/><line class="hair" x1="350" y1="346" x2="350" y2="398" stroke-width="1.5"/><text class="ink" x="346" y="338" font-size="9" font-weight="700">what happened</text><text class="ink" x="326" y="422" font-size="10.5" font-weight="600">RN+ wins 80% of 2,000 draws</text><text class="muted" x="326" y="436" font-size="9.5">LR took it, 33,889 to 26,116</text></g><line class="faint" x1="18" y1="494" x2="868" y2="494"/><text class="muted" x="18" y="514" font-size="10.5">Steps 1 and 2 happen once per simulation; 3 and 4 run in all 501 districts. Repeated draws favour RN+, but LR won —</text><text class="muted" x="18" y="528" font-size="10.5">the same over-projection of the far right that the results section takes apart.</text></svg>
